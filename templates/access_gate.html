<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Доступ к читалке — {{ app_title }}</title>
  <link rel="stylesheet" href="{{ static_url('style.css') }}" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="page-access-gate" data-app-access-gate>
  {% set gate_fox = fox.fox_sitting_front or fox.fox_heart or fox.fox_pic or fox.fox_peek_right or fox.fox_side %}
  <main class="access-gate-shell">
    <div class="access-gate-brand" aria-label="Зефиркины баоцзы">
      <span aria-hidden="true">🥟</span>
      <span>Зефиркины баоцзы</span>
    </div>

    <section class="access-gate-card" role="main" aria-labelledby="access-gate-title">
      {% if gate_fox %}<img class="access-gate-fox" src="{{ gate_fox }}" alt="Лисичка" data-fox>{% endif %}
      <p class="access-gate-kicker">Доступ к читалке</p>
      <h1 id="access-gate-title">Упс... Вы не подписаны на основную группу</h1>
      <p class="access-gate-copy">Для получения доступа подпишитесь на группу.</p>
      <a
        class="access-gate-primary"
        href="{{ main_group_invite_url }}"
        target="_blank"
        rel="noopener noreferrer"
        data-telegram-link
        data-access-subscribe
      >Подписаться</a>
    </section>
  </main>

  <script>window.ZEFIRKI_FOX = {{ fox | tojson }}; window.ZEFIRKI_VIEWER = {{ viewer | tojson }};</script>
  <script src="{{ static_url('settings.js') }}"></script>
</body>
</html>
