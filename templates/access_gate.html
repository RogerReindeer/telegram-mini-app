<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Доступ к читалке — {{ app_title }}</title>
  <link rel="stylesheet" href="{{ static_url('style.css') }}" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="page-access-gate" data-app-access-gate>
  {% set gate_fox = fox.fox_sitting_front or fox.fox_heart or fox.fox_pic or fox.fox_peek_right or fox.fox_side %}
  <main class="access-gate-shell">
    <a class="access-gate-brand" href="/library"><span aria-hidden="true">🥟</span><span>Зефиркины баоцзы</span></a>
    <section class="access-gate-card" role="main">
      {% if gate_fox %}<img class="access-gate-fox" src="{{ gate_fox }}" alt="Лисичка" data-fox>{% endif %}
      <p class="access-gate-kicker">Доступ к читалке</p>
      <h1>Упс... Вы не подписаны на основную группу</h1>
      <p>Для получения доступа подпишитесь на группу.</p>
      <div class="access-gate-actions">
        <button
          class="access-gate-primary"
          type="button"
          data-subscribe-access
          data-invite-url="{{ main_group_invite_url }}"
        >Подписаться</button>
      </div>
    </section>
  </main>
  <script>window.ZEFIRKI_FOX = {{ fox | tojson }}; window.ZEFIRKI_VIEWER = {{ viewer | tojson }};</script>
  <script src="{{ static_url('settings.js') }}"></script>
</body>
</html>
