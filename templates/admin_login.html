<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Вход · {{ app_title }}</title>
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f6f4ef; color:#24211d; }
    .card { width:min(420px, calc(100vw - 32px)); padding:28px; box-sizing:border-box; border-radius:20px; background:#fff; box-shadow:0 16px 60px rgba(0,0,0,.12); }
    h1 { margin:0 0 8px; font-size:24px; }
    p { margin:0 0 20px; color:#6b655d; line-height:1.45; }
    label { display:block; font-size:13px; font-weight:700; margin-bottom:8px; }
    input { width:100%; box-sizing:border-box; border:1px solid #d8d2c9; border-radius:12px; padding:12px 14px; font:inherit; }
    button { width:100%; margin-top:14px; border:0; border-radius:12px; padding:12px 14px; font:inherit; font-weight:800; cursor:pointer; background:#24211d; color:#fff; }
    .error { margin:0 0 14px; padding:10px 12px; border-radius:10px; background:#ffe8e6; color:#8a1f17; font-size:14px; }
    @media (prefers-color-scheme: dark) { body{background:#161616;color:#f4f1eb}.card{background:#222}.card p{color:#aaa49a}input{background:#191919;color:#fff;border-color:#444}button{background:#f1c75b;color:#201b0e}.error{background:#4a211f;color:#ffc7c2} }
  </style>
  <script defer src="{{ static_url('settings.js') }}"></script>
</head>
<body>
  <main class="card">
    <h1>Панель администратора</h1>
    <p>Введите отдельный ADMIN_TOKEN. Он не сохраняется в адресной строке.</p>
    {% if error %}<div class="error">Неверный токен администратора.</div>{% endif %}
    <form method="post" action="/admin/login" autocomplete="off">
      <label for="token">ADMIN_TOKEN</label>
      <input id="token" name="token" type="password" required autocomplete="current-password">
      <button type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
