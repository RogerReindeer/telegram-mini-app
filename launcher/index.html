<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f3" id="themeColor">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; connect-src https://telegram-mini-app-fwq0.onrender.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Загрузка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --loader-bg: #fff8f3;
      --loader-track: rgba(255, 106, 0, .18);
      --loader-accent: #ff6a00;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--loader-bg);
    }
    body.dark {
      color-scheme: dark;
      --loader-bg: #100d0b;
      --loader-track: rgba(255, 145, 65, .18);
      --loader-accent: #ff8128;
    }
    .loader-shell {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      padding: 0;
      border: 0;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--loader-track);
      border-top-color: var(--loader-accent);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 1.8s; }
    }
  </style>
</head>
<body>
  <button class="loader-shell" id="loader" type="button" aria-label="Загрузка">
    <span class="spinner" aria-hidden="true"></span>
  </button>
  <script>
    (() => {
      "use strict";
      const BACKEND_ORIGIN = "https://telegram-mini-app-fwq0.onrender.com";
      const HEALTH_URL = `${BACKEND_ORIGIN}/health`;
      const loader = document.getElementById("loader");
      const themeColor = document.getElementById("themeColor");
      let runId = 0;

      function applyTheme() {
        try {
          const tg = window.Telegram && window.Telegram.WebApp;
          const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          const dark = tg ? tg.colorScheme === "dark" : prefersDark;
          document.body.classList.toggle("dark", dark);
          themeColor.setAttribute("content", dark ? "#100d0b" : "#fff8f3");
          if (tg) {
            tg.ready();
            if (typeof tg.expand === "function") tg.expand();
            const accent = tg.themeParams && tg.themeParams.button_color;
            if (accent && /^#[0-9a-f]{6}$/i.test(accent)) {
              document.documentElement.style.setProperty("--loader-accent", accent);
            }
          }
        } catch (_) {}
      }

      function safeTargetPath() {
        const path = window.location.pathname || "/";
        if (path === "/" || path === "/index.html" || path === "/startup-shell") return "/library";
        if (path === "/library" || path.startsWith("/novel/") || path.startsWith("/chapter/") || path === "/reader-preview") return path;
        return "/library";
      }

      function telegramLaunchFragment() {
        const current = (window.location.hash || "").replace(/^#/, "");
        if (current) return current;
        try {
          const tg = window.Telegram && window.Telegram.WebApp;
          if (!tg || !tg.initData) return "";
          const params = new URLSearchParams();
          params.set("tgWebAppData", tg.initData);
          if (tg.version) params.set("tgWebAppVersion", tg.version);
          if (tg.platform) params.set("tgWebAppPlatform", tg.platform);
          return params.toString();
        } catch (_) {
          return "";
        }
      }

      function buildTargetUrl() {
        const path = safeTargetPath();
        const target = new URL(path, BACKEND_ORIGIN);
        const sourceQuery = new URLSearchParams(window.location.search);
        const next = sourceQuery.get("next");
        if (path === "/reader-preview" && next && /^\/(?:library|novel\/|chapter\/)/.test(next)) {
          target.searchParams.set("next", next);
        }
        if (window.location.origin === BACKEND_ORIGIN) target.searchParams.set("__reader_boot", "1");
        const fragment = telegramLaunchFragment();
        if (fragment) target.hash = fragment;
        return target.toString();
      }

      async function isBackendReady() {
        const controller = new AbortController();
        const timer = window.setTimeout(() => controller.abort(), 12000);
        try {
          const response = await fetch(`${HEALTH_URL}?boot=${Date.now()}`, {
            method: "GET",
            mode: window.location.origin === BACKEND_ORIGIN ? "same-origin" : "cors",
            credentials: "omit",
            cache: "no-store",
            signal: controller.signal,
            headers: { "Accept": "application/json" }
          });
          if (!response.ok) return false;
          const payload = await response.json();
          return Boolean(payload && payload.status === "ok");
        } catch (_) {
          return false;
        } finally {
          window.clearTimeout(timer);
        }
      }

      function wait(delay) {
        return new Promise((resolve) => window.setTimeout(resolve, delay));
      }

      async function wakeAndOpen() {
        const currentRun = ++runId;
        let attempt = 0;
        while (currentRun === runId) {
          if (await isBackendReady()) {
            window.location.replace(buildTargetUrl());
            return;
          }
          attempt += 1;
          await wait(Math.min(4000, 650 + attempt * 350));
        }
      }

      loader.addEventListener("click", wakeAndOpen);
      window.addEventListener("online", wakeAndOpen);
      applyTheme();
      wakeAndOpen();
    })();
  </script>
</body>
</html>
