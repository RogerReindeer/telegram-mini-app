<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff7ed" />
  <title>Зефиркины баоцзы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fff7ed;
      --text: #2b180c;
      --accent: #ff6a00;
      --track: rgba(255, 106, 0, .18);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    body.dark {
      --bg: #17100c;
      --text: #fff6ed;
      --track: rgba(255, 135, 53, .20);
    }
    .boot {
      width: min(280px, calc(100vw - 40px));
      display: grid;
      justify-items: center;
      gap: 22px;
      text-align: center;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 4px solid var(--track);
      border-top-color: var(--accent);
      animation: spin .82s linear infinite;
    }
    .spinner[hidden], .error[hidden], .retry[hidden] { display: none; }
    .error { margin: 0; font-size: 15px; font-weight: 700; }
    .retry {
      min-height: 44px;
      padding: 10px 18px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.5s; } }
  </style>
</head>
<body>
  <main class="boot" aria-live="polite">
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <span class="sr-only" id="bootStatus" role="status">Загрузка</span>
    <p class="error" id="bootError" hidden>Не удалось загрузить</p>
    <button class="retry" id="retryButton" type="button" hidden>Попробовать ещё раз</button>
  </main>

  <script>
    (() => {
      "use strict";

      const BACKEND_ORIGIN = "https://telegram-mini-app-fwq0.onrender.com";
      const HEALTH_URL = `${BACKEND_ORIGIN}/health`;
      const spinner = document.getElementById("spinner");
      const status = document.getElementById("bootStatus");
      const error = document.getElementById("bootError");
      const retry = document.getElementById("retryButton");
      let stopped = false;

      function applyTelegramTheme() {
        try {
          const tg = window.Telegram && window.Telegram.WebApp;
          if (!tg) return;
          tg.ready();
          if (tg.colorScheme === "dark") document.body.classList.add("dark");
          const bg = tg.themeParams && tg.themeParams.bg_color;
          if (bg && /^#[0-9a-f]{6}$/i.test(bg)) {
            document.documentElement.style.setProperty("--telegram-bg", bg);
          }
        } catch (_) {}
      }

      function safeTargetPath() {
        const path = window.location.pathname || "/";
        if (path === "/" || path === "/index.html") return "/library";
        if (path === "/library" || path.startsWith("/novel/") || path.startsWith("/chapter/") || path === "/reader-preview") {
          return path;
        }
        return "/library";
      }

      function telegramLaunchFragment() {
        const current = (window.location.hash || "").replace(/^#/, "");
        if (current) return current;
        try {
          const tg = window.Telegram && window.Telegram.WebApp;
          if (tg && tg.initData) {
            const params = new URLSearchParams();
            params.set("tgWebAppData", tg.initData);
            if (tg.version) params.set("tgWebAppVersion", tg.version);
            if (tg.platform) params.set("tgWebAppPlatform", tg.platform);
            return params.toString();
          }
        } catch (_) {}
        return "";
      }

      function buildTargetUrl() {
        const target = new URL(safeTargetPath(), BACKEND_ORIGIN);
        const sourceQuery = new URLSearchParams(window.location.search);
        const next = sourceQuery.get("next");
        if (safeTargetPath() === "/reader-preview" && next && /^\/(?:library|novel\/|chapter\/)/.test(next)) {
          target.searchParams.set("next", next);
        }
        const fragment = telegramLaunchFragment();
        if (fragment) target.hash = fragment;
        return target.toString();
      }

      async function probe() {
        if (stopped) return false;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 10000);
        try {
          const response = await fetch(`${HEALTH_URL}?boot=${Date.now()}`, {
            method: "GET",
            mode: "cors",
            credentials: "omit",
            cache: "no-store",
            signal: controller.signal,
            headers: { "Accept": "application/json" }
          });
          if (!response.ok) return false;
          const payload = await response.json();
          return payload && payload.status === "ok";
        } catch (_) {
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      async function wakeAndOpen() {
        stopped = false;
        spinner.hidden = false;
        error.hidden = true;
        retry.hidden = true;
        status.textContent = "Загрузка";

        for (let round = 0; round < 12 && !stopped; round += 1) {
          if (await probe()) {
            status.textContent = "Готово";
            window.location.replace(buildTargetUrl());
            return;
          }
          await new Promise((resolve) => setTimeout(resolve, Math.min(900 + round * 150, 2200)));
        }

        spinner.hidden = true;
        error.hidden = false;
        status.textContent = "Не удалось загрузить";
        retry.hidden = false;
      }

      retry.addEventListener("click", wakeAndOpen);
      applyTelegramTheme();
      wakeAndOpen();
    })();
  </script>
</body>
</html>
