services:
  - type: web
    runtime: static
    name: telegram-mini-app-launcher
    buildCommand: echo "launcher ready"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Referrer-Policy
        value: no-referrer
