services:
  - type: web
    name: telegram-mini-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: QINGHE_SHOP_URL
        sync: false

  # Always-on CDN shell. Telegram should open this service URL, not the
  # sleeping Python service URL. It wakes the backend and redirects only after
  # /health answers successfully.
  - type: web
    name: telegram-mini-app-launcher
    runtime: static
    rootDir: launcher
    buildCommand: echo "launcher ready"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://telegram-mini-app-fwq0.onrender.com; object-src 'none'; base-uri 'none'; form-action 'none'"
